---
- name: demo playbook started by rulebook
  hosts: all
  gather_facts: false
  tasks:
  - name: show event
    ansible.builtin.debug:
      msg: "受信したメッセージ: {{ ansible_eda.event.payload.message }}"

  - name: get uptime
    ansible.builtin.command:
      cmd: uptime
    register: ret_uptime
    changed_when: false

  - name: show uptime
    ansible.builtin.debug:
      msg: "{{ inventory_hostname }}: {{ ret_uptime.stdout }}"
