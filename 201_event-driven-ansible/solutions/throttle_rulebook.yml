---
- name: throttle rulebook
  hosts: all
  sources:
  - ansible.eda.webhook:
      host: 0.0.0.0
      port: 5000
    filters:
    - eda.builtin.insert_hosts_to_meta:
        host_path: payload.host

  rules:
  - name: service down
    condition: event.payload.alert == "service_down"
    throttle:
      once_within: 1 minute
      group_by_attributes:
      - event.payload.host
    action:
      run_playbook:
        name: ops_service.yml
        extra_vars:
          service_name: "{{ event.payload.service }}"
